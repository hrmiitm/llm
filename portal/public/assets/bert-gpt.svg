<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="270" viewBox="0 0 1080 270" role="img" aria-labelledby="title desc">
  <title id="title">BERT and GPT learning objectives</title>
  <desc id="desc">BERT uses bidirectional attention to predict a masked token, while GPT uses causal attention to predict the next token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#102a43}.box{stroke-width:2}.bert{fill:#e8f1ff;stroke:#1355a6}.gpt{fill:#fff4e5;stroke:#d97706}.label{font-size:17px;font-weight:600}.small{font-size:13px}</style>
  </defs>
  <text x="270" y="32" text-anchor="middle" class="label">BERT — fill in a hidden token</text>
  <rect x="30" y="75" width="200" height="72" rx="12" class="box bert"/><text x="130" y="106" text-anchor="middle" class="label">[CLS] The [MASK]</text><text x="130" y="128" text-anchor="middle" class="small">barked [SEP]</text>
  <line x1="230" y1="111" x2="315" y2="111" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="75" width="180" height="72" rx="12" class="box bert"/><text x="410" y="105" text-anchor="middle" class="label">Bidirectional</text><text x="410" y="127" text-anchor="middle" class="small">encoder attention</text>
  <line x1="500" y1="111" x2="585" y2="111" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="75" width="190" height="72" rx="12" class="box bert"/><text x="685" y="105" text-anchor="middle" class="label">Predict: dog</text><text x="685" y="127" text-anchor="middle" class="small">left + right context</text>
  <text x="270" y="185" text-anchor="middle" class="label">GPT — continue a prefix</text>
  <rect x="30" y="205" width="200" height="45" rx="12" class="box gpt"/><text x="130" y="234" text-anchor="middle" class="label">The dog</text>
  <line x1="230" y1="227" x2="315" y2="227" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="195" width="180" height="62" rx="12" class="box gpt"/><text x="410" y="222" text-anchor="middle" class="label">Causal decoder</text><text x="410" y="242" text-anchor="middle" class="small">past only</text>
  <line x1="500" y1="227" x2="585" y2="227" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="195" width="190" height="62" rx="12" class="box gpt"/><text x="685" y="222" text-anchor="middle" class="label">Predict: barked</text><text x="685" y="242" text-anchor="middle" class="small">then append and repeat</text>
</svg>
