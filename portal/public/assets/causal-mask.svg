<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Causal attention masking</title><desc id="desc">Future positions are masked before softmax using negative infinity, leaving a lower-triangular visibility pattern.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#102a43}.box{stroke-width:2}.op{fill:#fff4e5;stroke:#d97706}.result{fill:#ecfdf5;stroke:#15803d}.label{font-size:17px;font-weight:600}.small{font-size:13px}</style></defs>
  <rect x="30" y="105" width="175" height="65" rx="12" class="box op"/><text x="117" y="133" text-anchor="middle" class="label">Raw scores</text><text x="117" y="153" text-anchor="middle" class="small">all pairs</text>
  <line x1="205" y1="137" x2="275" y2="137" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="105" width="190" height="65" rx="12" class="box op"/><text x="375" y="133" text-anchor="middle" class="label">Mask future</text><text x="375" y="153" text-anchor="middle" class="small">add −∞ above diagonal</text>
  <line x1="470" y1="137" x2="540" y2="137" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="545" y="105" width="140" height="65" rx="12" class="box op"/><text x="615" y="133" text-anchor="middle" class="label">Softmax</text><text x="615" y="153" text-anchor="middle" class="small">each row</text>
  <line x1="685" y1="137" x2="755" y2="137" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="760" y="105" width="115" height="65" rx="12" class="box result"/><text x="817" y="133" text-anchor="middle" class="label">Weights</text><text x="817" y="153" text-anchor="middle" class="small">past only</text>
  <g transform="translate(300 205)"><text x="0" y="0" class="small">Visibility matrix (1 = allowed, 0 = future)</text><rect x="0" y="15" width="180" height="72" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><path d="M45 15V87M90 15V87M135 15V87M0 33H180M0 51H180M0 69H180" stroke="#86efac"/><path d="M45 15H180V87H0V69H45V51H90V33H135Z" fill="#fee2e2" opacity=".9"/><text x="23" y="29" class="small">1</text><text x="68" y="47" class="small">1</text><text x="113" y="65" class="small">1</text><text x="158" y="83" class="small">1</text></g>
</svg>
