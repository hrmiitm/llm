<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Transformer encoder-decoder block</title><desc id="desc">Source tokens flow through an encoder and target tokens flow through masked self-attention, cross-attention, feed-forward, and output projection.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#102a43}.box{stroke-width:2}.in{fill:#e8f1ff;stroke:#1355a6}.block{fill:#fff4e5;stroke:#d97706}.out{fill:#ecfdf5;stroke:#15803d}.label{font-size:17px;font-weight:600}.small{font-size:13px}</style></defs>
  <rect x="50" y="35" width="330" height="530" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="215" y="68" text-anchor="middle" class="label">ENCODER</text>
  <rect x="520" y="35" width="330" height="530" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="685" y="68" text-anchor="middle" class="label">DECODER</text>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M215 125 V150"/><path d="M215 225 V250"/><path d="M215 325 V350"/><path d="M215 425 V450"/>
    <path d="M685 125 V150"/><path d="M685 225 V250"/><path d="M685 325 V350"/><path d="M685 425 V450"/>
    <path d="M380 400 C450 400 450 290 520 290"/>
  </g>
  <rect x="105" y="85" width="220" height="40" rx="9" class="box in"/><text x="215" y="111" text-anchor="middle" class="label">Source embeddings + PE</text>
  <rect x="105" y="175" width="220" height="50" rx="9" class="box block"/><text x="215" y="197" text-anchor="middle" class="label">Self-attention</text><text x="215" y="215" text-anchor="middle" class="small">+ Add &amp; Norm</text>
  <rect x="105" y="275" width="220" height="50" rx="9" class="box block"/><text x="215" y="297" text-anchor="middle" class="label">Feed-forward</text><text x="215" y="315" text-anchor="middle" class="small">+ Add &amp; Norm</text>
  <rect x="105" y="375" width="220" height="50" rx="9" class="box out"/><text x="215" y="397" text-anchor="middle" class="label">Encoder states H</text><text x="215" y="415" text-anchor="middle" class="small">keys and values</text>
  <rect x="105" y="475" width="220" height="50" rx="9" class="box out"/><text x="215" y="497" text-anchor="middle" class="label">Context memory</text><text x="215" y="515" text-anchor="middle" class="small">sent to decoder</text>
  <rect x="575" y="85" width="220" height="40" rx="9" class="box in"/><text x="685" y="111" text-anchor="middle" class="label">Shifted target + PE</text>
  <rect x="575" y="175" width="220" height="50" rx="9" class="box block"/><text x="685" y="197" text-anchor="middle" class="label">Masked self-attention</text><text x="685" y="215" text-anchor="middle" class="small">+ Add &amp; Norm</text>
  <rect x="575" y="275" width="220" height="50" rx="9" class="box block"/><text x="685" y="297" text-anchor="middle" class="label">Cross-attention</text><text x="685" y="315" text-anchor="middle" class="small">queries decoder; K,V encoder</text>
  <rect x="575" y="375" width="220" height="50" rx="9" class="box block"/><text x="685" y="397" text-anchor="middle" class="label">Feed-forward</text><text x="685" y="415" text-anchor="middle" class="small">+ Add &amp; Norm</text>
  <rect x="575" y="475" width="220" height="50" rx="9" class="box out"/><text x="685" y="497" text-anchor="middle" class="label">Linear + softmax</text><text x="685" y="515" text-anchor="middle" class="small">next-token distribution</text>
</svg>
