<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="890" viewBox="0 -100 1040 890" role="img" aria-labelledby="title desc">
  <title id="title">Lettered Transformer encoder-decoder architecture</title>
  <desc id="desc">Faithful vector rendering of the A through U labelled encoder-decoder block in the source question paper.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#182534"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#182534;stroke-width:2.2;rx:5;}
      .frame{fill:none;stroke:#182534;stroke-width:2.2;rx:20;}
      .edge{fill:none;stroke:#182534;stroke-width:2.2;marker-end:url(#arrow);}
      .label{font:700 22px Arial,sans-serif;fill:#182534;text-anchor:middle;}
      .caption{font:600 18px Arial,sans-serif;fill:#182534;text-anchor:middle;}
      .repeat{font:700 19px Arial,sans-serif;fill:#182534;}
    </style>
  </defs>
  <rect x="0" y="-100" width="1040" height="890" fill="#ffffff"/>

  <!-- Encoder input and positional addition -->
  <text class="caption" x="275" y="760">Inputs</text>
  <path class="edge" d="M275 735V704"/>
  <rect class="box" x="222" y="657" width="106" height="47"/>
  <text class="label" x="275" y="680">A</text>
  <path class="edge" d="M275 657V622"/>
  <circle cx="275" cy="600" r="18" fill="#fff" stroke="#182534" stroke-width="2.2"/>
  <text class="label" x="275" y="600">+</text>
  <rect class="box" x="120" y="576" width="80" height="47"/>
  <text class="label" x="160" y="599">B</text>
  <path class="edge" d="M200 599H257"/>

  <!-- Encoder N times -->
  <rect class="frame" x="104" y="253" width="231" height="315"/>
  <text class="repeat" x="55" y="405">N×</text>
  <path class="edge" d="M275 582V550"/>
  <rect class="box" x="222" y="503" width="106" height="47"/>
  <text class="label" x="275" y="526">E</text>
  <path class="edge" d="M275 503V475"/>
  <rect class="box" x="222" y="428" width="106" height="47"/>
  <text class="label" x="275" y="451">F</text>
  <path class="edge" d="M275 428V400"/>
  <rect class="box" x="222" y="353" width="106" height="47"/>
  <text class="label" x="275" y="376">G</text>
  <path class="edge" d="M275 353V325"/>
  <rect class="box" x="222" y="278" width="106" height="47"/>
  <text class="label" x="275" y="301">H</text>
  <!-- Encoder residual paths -->
  <path class="edge" d="M257 600H142V451H222"/>
  <path class="edge" d="M222 451H126V301H222"/>

  <!-- Decoder input and positional addition -->
  <text class="caption" x="725" y="748">Outputs</text>
  <text class="caption" x="725" y="772">(shifted right)</text>
  <path class="edge" d="M725 722V704"/>
  <rect class="box" x="672" y="657" width="106" height="47"/>
  <text class="label" x="725" y="680">C</text>
  <path class="edge" d="M725 657V622"/>
  <circle cx="725" cy="600" r="18" fill="#fff" stroke="#182534" stroke-width="2.2"/>
  <text class="label" x="725" y="600">+</text>
  <rect class="box" x="799" y="576" width="80" height="47"/>
  <text class="label" x="839" y="599">D</text>
  <path class="edge" d="M799 599H743"/>

  <!-- Decoder N times -->
  <rect class="frame" x="579" y="136" width="251" height="432"/>
  <text class="repeat" x="850" y="353">N×</text>
  <path class="edge" d="M725 582V550"/>
  <rect class="box" x="672" y="503" width="106" height="47"/>
  <text class="label" x="725" y="526">L</text>
  <path class="edge" d="M725 503V475"/>
  <rect class="box" x="672" y="428" width="106" height="47"/>
  <text class="label" x="725" y="451">M</text>
  <path class="edge" d="M725 428V395"/>
  <rect class="box" x="672" y="348" width="106" height="47"/>
  <text class="label" x="725" y="371">O</text>
  <path class="edge" d="M725 348V320"/>
  <rect class="box" x="672" y="273" width="106" height="47"/>
  <text class="label" x="725" y="296">P</text>
  <path class="edge" d="M725 273V245"/>
  <rect class="box" x="672" y="198" width="106" height="47"/>
  <text class="label" x="725" y="221">Q</text>
  <path class="edge" d="M725 198V170"/>
  <rect class="box" x="672" y="123" width="106" height="47"/>
  <text class="label" x="725" y="146">R</text>
  <!-- Decoder residual paths -->
  <path class="edge" d="M743 600H805V451H778"/>
  <path class="edge" d="M778 451H812V296H778"/>
  <path class="edge" d="M778 296H818V146H778"/>
  <!-- Encoder state connection into decoder cross-attention block -->
  <path class="edge" d="M328 301H470Q520 301 520 371H672"/>

  <!-- Decoder output head -->
  <path class="edge" d="M725 123V94"/>
  <rect class="box" x="672" y="47" width="106" height="47"/>
  <text class="label" x="725" y="70">S</text>
  <path class="edge" d="M725 47V19"/>
  <rect class="box" x="672" y="-28" width="106" height="47"/>
  <text class="label" x="725" y="-5">T</text>
  <path class="edge" d="M725 -28V-47"/>
  <text class="label" x="725" y="-64">U</text>
</svg>
