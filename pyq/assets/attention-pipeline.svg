<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Scaled dot-product attention pipeline</title>
  <desc id="desc">Token embeddings create queries, keys and values. Queries and keys create scores, which are normalized and used to combine values.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#102a43} .box{stroke-width:2} .tensor{fill:#e8f1ff;stroke:#1355a6} .op{fill:#fff4e5;stroke:#d97706} .label{font-size:18px;font-weight:600} .small{font-size:15px}</style>
  </defs>
  <rect x="30" y="95" width="170" height="70" rx="12" class="box tensor"/>
  <text x="115" y="125" text-anchor="middle" class="label">Embeddings X</text><text x="115" y="148" text-anchor="middle" class="small">token vectors</text>
  <line x1="200" y1="130" x2="265" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="30" width="150" height="52" rx="10" class="box tensor"/><text x="345" y="63" text-anchor="middle" class="label">Q = WQ X</text>
  <rect x="270" y="104" width="150" height="52" rx="10" class="box tensor"/><text x="345" y="137" text-anchor="middle" class="label">K = WK X</text>
  <rect x="270" y="178" width="150" height="52" rx="10" class="box tensor"/><text x="345" y="211" text-anchor="middle" class="label">V = WV X</text>
  <line x1="200" y1="130" x2="260" y2="56" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="200" y1="130" x2="260" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="200" y1="130" x2="260" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="56" x2="485" y2="94" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="420" y1="130" x2="485" y2="112" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="78" width="180" height="70" rx="12" class="box op"/><text x="580" y="108" text-anchor="middle" class="label">QᵀK / √dₖ</text><text x="580" y="132" text-anchor="middle" class="small">score matrix</text>
  <line x1="670" y1="113" x2="735" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="78" width="170" height="70" rx="12" class="box op"/><text x="825" y="108" text-anchor="middle" class="label">Softmax</text><text x="825" y="132" text-anchor="middle" class="small">attention weights</text>
  <line x1="420" y1="204" x2="735" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="113" x2="975" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980" y="78" width="180" height="70" rx="12" class="box tensor"/><text x="1070" y="108" text-anchor="middle" class="label">Weighted sum</text><text x="1070" y="132" text-anchor="middle" class="small">context vectors</text>
</svg>
