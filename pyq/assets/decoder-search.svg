<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Language-model probability tree</title>
  <desc id="desc">The START token branches to i and you, then to like and eat, then to apples and bananas.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#102a43}.node{stroke-width:2}.root{fill:#e8f1ff;stroke:#1355a6}.branch{fill:#fff4e5;stroke:#d97706}.leaf{fill:#ecfdf5;stroke:#15803d}.label{font-size:16px;font-weight:600}.prob{font-size:13px}</style></defs>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M95 190 C145 120 155 95 220 85"/><path d="M95 210 C145 275 155 305 220 315"/>
    <path d="M320 85 C380 35 405 35 465 58"/><path d="M320 95 C380 120 405 130 465 130"/>
    <path d="M320 315 C380 265 405 265 465 290"/><path d="M320 325 C380 350 405 365 465 365"/>
    <path d="M565 58 C650 30 690 35 755 45"/><path d="M565 70 C650 75 690 95 755 115"/>
    <path d="M565 130 C650 130 690 150 755 175"/><path d="M565 142 C650 190 690 205 755 245"/>
    <path d="M565 290 C650 285 690 285 755 285"/><path d="M565 302 C650 330 690 345 755 355"/>
    <path d="M565 365 C650 370 690 385 755 400"/>
  </g>
  <g class="node root"><rect x="35" y="175" width="120" height="50" rx="12"/><text x="95" y="205" text-anchor="middle" class="label">&lt;START&gt;</text></g>
  <g class="node branch"><rect x="220" y="60" width="100" height="50" rx="12"/><text x="270" y="88" text-anchor="middle" class="label">i</text><text x="270" y="103" text-anchor="middle" class="prob">0.5</text></g>
  <g class="node branch"><rect x="220" y="290" width="100" height="50" rx="12"/><text x="270" y="318" text-anchor="middle" class="label">you</text><text x="270" y="333" text-anchor="middle" class="prob">0.4</text></g>
  <g class="node branch"><rect x="465" y="33" width="100" height="50" rx="12"/><text x="515" y="61" text-anchor="middle" class="label">like</text><text x="515" y="76" text-anchor="middle" class="prob">0.6 / 0.4</text></g>
  <g class="node branch"><rect x="465" y="105" width="100" height="50" rx="12"/><text x="515" y="133" text-anchor="middle" class="label">eat</text><text x="515" y="148" text-anchor="middle" class="prob">0.3 / 0.5</text></g>
  <g class="node branch"><rect x="465" y="265" width="100" height="50" rx="12"/><text x="515" y="293" text-anchor="middle" class="label">like</text><text x="515" y="308" text-anchor="middle" class="prob">you: 0.4</text></g>
  <g class="node branch"><rect x="465" y="340" width="100" height="50" rx="12"/><text x="515" y="368" text-anchor="middle" class="label">eat</text><text x="515" y="383" text-anchor="middle" class="prob">you: 0.5</text></g>
  <g class="node leaf"><rect x="755" y="20" width="120" height="45" rx="10"/><text x="815" y="48" text-anchor="middle" class="label">apples 0.7</text></g><g class="node leaf"><rect x="755" y="90" width="120" height="45" rx="10"/><text x="815" y="118" text-anchor="middle" class="label">bananas 0.2</text></g>
  <g class="node leaf"><rect x="755" y="155" width="120" height="45" rx="10"/><text x="815" y="183" text-anchor="middle" class="label">apples 0.4</text></g><g class="node leaf"><rect x="755" y="225" width="120" height="45" rx="10"/><text x="815" y="253" text-anchor="middle" class="label">bananas 0.6</text></g>
  <g class="node leaf"><rect x="755" y="265" width="120" height="45" rx="10"/><text x="815" y="293" text-anchor="middle" class="label">apples 0.4</text></g><g class="node leaf"><rect x="755" y="335" width="120" height="45" rx="10"/><text x="815" y="363" text-anchor="middle" class="label">bananas 0.5</text></g>
  <g class="node leaf"><rect x="755" y="375" width="120" height="45" rx="10"/><text x="815" y="403" text-anchor="middle" class="label">apples 0.9</text></g>
  <text x="930" y="235" class="prob">Each edge probability is multiplied</text><text x="930" y="255" class="prob">along a complete path.</text>
</svg>
